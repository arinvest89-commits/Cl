services:
  - type: web
    name: agent-team
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: agent-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
